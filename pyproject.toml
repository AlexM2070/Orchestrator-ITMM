[tool.ruff]
# Длина строки (совпадает со стандартами Black)
line-length = 150
target-version = "py311"

[tool.ruff.lint]
# Выбираем правила: E/W (pycodestyle), F (Pyflakes), I (isort), UP (pyupgrade)
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
# Настройки форматтера
quote-style = "double"
indent-style = "space"